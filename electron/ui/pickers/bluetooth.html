<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Select Bluetooth device</title>
<style>
  /* layout jako portPicker */
  html,body{height:100%;margin:0}
  body{font-family:Geneva,Arial,"Segoe UI",sans-serif;display:flex;flex-direction:column;background:#fff;color:#000}
  button{font-family:inherit;}
  h2{margin:12px 0;text-align:center;font-weight:600}

  /* scrollovací seznam zařízení */
  #devList{
    flex:1;
    overflow-y:auto;
    padding:0 16px 8px;
    display:flex;flex-direction:column;gap:8px;
  }

  /* dlaždice zařízení */
  .devBtn{
    background:#efefef;border:none;border-radius:8px;width:100%;
    padding:8px 12px;text-align:left;cursor:pointer;transition:background .15s;
  }
  .devBtn:hover{background:#c8f1c8;} /* pastelová zelená jako u portů */
  .dev-name{font-size:15px;font-weight:600}
  .dev-info{font-size:12px;color:#555;margin-top:2px}

  /* spodní lišta */
  #closeRow{padding:10px 0;text-align:center;border-top:1px solid #ddd}
  #closeBtn{padding:6px 18px;border:none;border-radius:6px;background:#9e9e9e;color:#fff;cursor:pointer}
  #closeBtn:hover{background:#bdbdbd}

  .empty{font-size:14px;color:#666;padding:12px}
  .mono{font-family:ui-monospace,Consolas,monospace}
</style>
</head>
<body>
  <h2 id="pickerTitle">Select Bluetooth device</h2>

  <div id="devList"><div class="empty" id="loadingText">Searching for devices…</div></div>

  <div id="closeRow"><button id="closeBtn">Close</button></div>

<script src="picker-i18n.js"></script>
<script>
  const pickerLanguage = new URLSearchParams(window.location.search).get('lang');
  const pickerI18n = window.ESPIDE_PICKER_I18N.getMessages(pickerLanguage);
  const pickerMessages = pickerI18n.messages;
  document.documentElement.lang = pickerI18n.language;
  document.title = pickerMessages.bluetoothTitle;
  document.getElementById('pickerTitle').textContent = pickerMessages.bluetoothTitle;
  document.getElementById('closeBtn').textContent = pickerMessages.close;
  document.getElementById('loadingText').textContent = pickerMessages.loading;

  const devListEl = document.getElementById('devList');

  function render(list){
    devListEl.replaceChildren();
    if (!list || !list.length){
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = pickerMessages.nothingFound;
      devListEl.appendChild(empty);
      return;
    }
    for (const d of list){
      const name = d.name && d.name.trim() ? d.name : pickerMessages.unnamedDevice;
      const id = d.id || '';
      const btn = document.createElement('button');
      btn.className = 'devBtn';
      const nameElement = document.createElement('div');
      nameElement.className = 'dev-name';
      nameElement.textContent = name;
      const info = document.createElement('div');
      info.className = 'dev-info';
      info.append('MAC: ');
      const address = document.createElement('span');
      address.className = 'mono';
      address.textContent = id;
      info.appendChild(address);
      btn.append(nameElement, info);
      btn.onclick = () => window.btPicker.choose(id);
      devListEl.appendChild(btn);
    }
  }

  // přijímání průběžných výsledků skenu
  window.btPicker.onDevices(render);

  // zrušení výběru
  document.getElementById('closeBtn').onclick = () => window.btPicker.cancel();
  
  window.addEventListener('keydown', e => { if (e.key === 'Escape') window.btPicker.cancel(); });

  
</script>



</body>
</html>
